<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="致舒宇">
  <!--
    /love-shuyu/ 专用图标。星形是页面里那条自绘四芒星路径（节点星、19 颗愿望星、
    信末印记共用），原 viewBox 24×24，这里放到 32×32 的深空底上并居中。
    刻意只有一颗实心星、没有描边和渐变：16px 标签页下细节全会糊掉，实心剪影才认得出。
    配色只取页面已有的深空 #03050c 与暖金 #ffd9a0，不引入新色。
  -->
  <rect width="32" height="32" rx="6" fill="#03050c" />
  <g transform="translate(2.5 2.5) scale(1.125)">
    <path
      d="M12 0C13.1 7.7 16.3 10.9 24 12C16.3 13.1 13.1 16.3 12 24C10.9 16.3 7.7 13.1 0 12C7.7 10.9 10.9 7.7 12 0Z"
      fill="#ffd9a0"
    />
  </g>
</svg>
